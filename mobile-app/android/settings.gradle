pluginManagement {
  def cachedAutolinkingDir = new File(rootDir, "build/generated/autolinking")
  def cachedAutolinkingJson = new File(cachedAutolinkingDir, "autolinking.json")
  if (cachedAutolinkingJson.exists()) {
    def expectedProjectRoot = rootDir.parentFile.absolutePath
    def rawJson = cachedAutolinkingJson.getText("UTF-8")
    if (!rawJson.contains(expectedProjectRoot) && !rawJson.contains(expectedProjectRoot.replace("\\", "\\\\"))) {
      cachedAutolinkingDir.deleteDir()
    }
  }

  def webviewGradle = new File(rootDir.parentFile, "node_modules/react-native-webview/android/build.gradle")
  if (webviewGradle.exists()) {
    def wvText = webviewGradle.getText("UTF-8").replace("\r\n", "\n")
    def targetBlock = "    repositories {\n        google()\n        gradlePluginPortal()\n    }\n    dependencies {\n        classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\${safeExtGet('kotlinVersion')}\")\n        classpath(\"com.android.tools.build:gradle:7.0.4\")\n    }"
    if (!wvText.contains("if (project == rootProject)") && wvText.contains(targetBlock)) {
      webviewGradle.setText(wvText.replace(targetBlock, "    if (project == rootProject) {\n" + targetBlock + "\n    }"), "UTF-8")
    }
  }

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Geo-Track HRMS System'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
